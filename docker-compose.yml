# FHIR Verity - Docker Compose
#
# Datenbank: zwei Wege, einer davon muss gewählt werden.
#
#   Weg A - externe PostgreSQL
#     Eine bestehende PostgreSQL wird genutzt. In der .env zeigt DATABASE_URL
#     auf den externen Host, z. B.
#       DATABASE_URL=postgresql+asyncpg://verity:<passwort>@db-host.example.org:5432/verity
#     Der Verity-Benutzer braucht CREATE-Rechte auf dem Schema (siehe
#     documentation/datenbank.md). Die Datei bleibt dafür wie sie ist.
#
#   Weg B - mitgelieferte PostgreSQL im Container
#     Verity bringt seine eigene Datenbank mit, es muss nichts vorbereitet
#     werden. Dafür unten die drei mit "Weg B" markierten Blöcke einkommentieren
#     (db-Service, depends_on im backend, pgdata-Volume) und in der .env setzen:
#       POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
#       DATABASE_URL=postgresql+asyncpg://<POSTGRES_USER>:<POSTGRES_PASSWORD>@db:5432/<POSTGRES_DB>
#     Host ist dann immer "db", die Daten liegen im Volume "pgdata".
#
# Anmeldung: Keycloak ist im Betrieb Pflicht (AUTH_ENABLED=true).
#   Eigener Keycloak des Standorts: nur KEYCLOAK_* in der .env setzen.
#   Kein Keycloak vorhanden: der mitgelieferte wird mit einer Zeile in der
#   .env zugeschaltet (siehe docker-compose.keycloak.yml): COMPOSE_FILE=docker-compose.yml:docker-compose.keycloak.yml
#
# Details: documentation/deployment.md

services:
  # --- Weg B: mitgelieferte Datenbank (einkommentieren) ----------------------
  # db:
  #   image: postgres:17
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: ${POSTGRES_DB}
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10
  #   restart: unless-stopped
  #   # kein "ports:" - die Datenbank ist nur für das Backend im Compose-Netz erreichbar

  backend:
    build: ./backend
    env_file: ./.env
    expose:
      - "8000"
    # --- Weg B: erst starten, wenn die Datenbank bereit ist (einkommentieren)
    # depends_on:
    #   db:
    #     condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # Standard: Let's-Encrypt-Zertifikat des Hosts. Lokal in der .env CADDY_TLS=internal setzen.
      CADDY_TLS: ${CADDY_TLS:-/etc/letsencrypt/live/${DOMAIN:-localhost}/fullchain.pem /etc/letsencrypt/live/${DOMAIN:-localhost}/privkey.pem}
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  # --- Weg B: Datenbank-Volume (einkommentieren)
  # pgdata:
