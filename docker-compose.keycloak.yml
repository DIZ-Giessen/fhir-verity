# FHIR Verity - mitgelieferter Keycloak (optional)
#
# Für Standorte ohne eigenen Keycloak. Wird zusätzlich zu docker-compose.yml
# geladen, am einfachsten über eine Zeile in der .env:
#     COMPOSE_FILE=docker-compose.yml:docker-compose.keycloak.yml
# Danach wie gewohnt: docker compose up -d
#
# Startet Keycloak mit eigener PostgreSQL (Volume "keycloak_pgdata") unter
# https://<DOMAIN>/kc. Beim ersten Start wird keycloak/verity-realm.json importiert: Realm "verity", Client für Verity und der Benutzer "verity-admin" (Passwort VERITY_ADMIN_PASSWORD, muss beim ersten Login geändert werden). Weitere Benutzer legt man in der Admin-Konsole
# https://<DOMAIN>/kc/admin an (Benutzer "admin", KEYCLOAK_ADMIN_PASSWORD).
#
#
#
#
#
#
#
# Details: documentation/deployment.md

services:
  keycloak-db:
    image: postgres:17
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD in .env setzen}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    # Importiert den Realm nur beim ersten Start; danach wird er in der
    # Keycloak-Admin-Konsole (https://<DOMAIN>/kc/admin) gepflegt.
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD in .env setzen}
      # Hinter Caddy unter /kc, TLS endet im Caddy.
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /kc
      KC_PROXY_HEADERS: xforwarded
      # Browser-URLs (Login-Seite, Issuer) zeigen auf die öffentliche Adresse,


      # das Backend spricht Keycloak intern über http://keycloak:8080 an.
      KC_HOSTNAME: https://${DOMAIN:-localhost}/kc
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"


      # Admin der Keycloak-Admin-Konsole (Realm "master").
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD in .env setzen}


      # Platzhalter in keycloak/verity-realm.json
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-fhir-verity}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET in .env setzen}
      VERITY_PUBLIC_URL: https://${DOMAIN:-localhost}

      # Benutzer für Verity (Realm "verity")
      VERITY_ADMIN_EMAIL: ${VERITY_ADMIN_EMAIL:?VERITY_ADMIN_EMAIL in .env setzen}
      VERITY_ADMIN_PASSWORD: ${VERITY_ADMIN_PASSWORD:?VERITY_ADMIN_PASSWORD in .env setzen}



    volumes:
      - ./keycloak/verity-realm.json:/opt/keycloak/data/import/verity-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  keycloak_pgdata:
